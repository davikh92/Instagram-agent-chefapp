<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@400;500&family=DM+Mono:wght@400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: {{HEIGHT}}px;
    background: #C8572A;
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Arcos decorativos de fundo */
  .arc {
    position: absolute;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.06);
    pointer-events: none;
  }
  .arc-1 { width: 900px; height: 900px; top: -200px; right: -300px; }
  .arc-2 { width: 600px; height: 600px; top: -100px; right: -100px; }
  .arc-3 { width: 400px; height: 400px; bottom: -100px; left: -100px; }

  .container {
    position: relative;
    width: 100%;
    height: 100%;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 1;
  }

  .label-top {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.65);
    text-transform: uppercase;
  }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 40px 0;
  }

  .headline {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: {{HEADLINE_SIZE}}px;
    line-height: 0.92;
    color: #FFFDF9;
    margin-bottom: 24px;
  }

  .headline em {
    font-style: italic;
    font-weight: 400;
    color: #E8784F;
  }

  .divider {
    width: 48px;
    height: 2px;
    background: rgba(255,255,255,0.35);
    margin: 28px 0;
  }

  .subtext {
    font-family: 'DM Sans', sans-serif;
    font-size: 18px;
    color: rgba(255,255,255,0.65);
    line-height: 1.5;
    max-width: 700px;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .footer-url {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.5);
  }

  .footer-cta {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: rgba(255,255,255,0.85);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <div class="arc arc-1"></div>
  <div class="arc arc-2"></div>
  <div class="arc arc-3"></div>

  <div class="container">
    <div class="label-top">Luiza na Cozinha</div>

    <div class="content">
      <div class="headline">{{HEADLINE}}</div>
      <div class="divider"></div>
      <div class="subtext">{{SUBTEXT}}</div>
    </div>

    <div class="footer">
      <span class="footer-url">luizanacozinha.app</span>
      <span class="footer-cta">🔖 SALVA</span>
    </div>
  </div>
</body>
</html>
