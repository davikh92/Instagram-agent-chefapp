<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@400;500&family=DM+Mono:wght@400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: {{HEIGHT}}px;
    background: #F7F2EA;
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
    position: relative;
  }

  .container {
    position: relative;
    width: 100%;
    height: 100%;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .label-top {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.15em;
    color: #9B7B5E;
    text-transform: uppercase;
  }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 32px 0;
  }

  .enquete-tag {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: #9B7B5E;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .emoji-center {
    font-size: 72px;
    line-height: 1;
    margin-bottom: 28px;
  }

  .question {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: {{HEADLINE_SIZE}}px;
    line-height: 1.15;
    color: #3D2B1F;
    margin-bottom: 44px;
    max-width: 820px;
  }

  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    max-width: 860px;
  }

  .option {
    background: #EDE4D3;
    border-radius: 12px;
    padding: 22px 28px;
    font-family: 'DM Sans', sans-serif;
    font-size: 18px;
    font-weight: 500;
    color: #3D2B1F;
    border: 2px solid transparent;
    transition: all 0.2s;
  }

  .option.highlight {
    background: #C8572A;
    color: #FFFDF9;
    border-color: #C8572A;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .footer-url {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: #9B7B5E;
  }

  .footer-cta {
    font-family: 'DM Sans', sans-serif;
    font-style: italic;
    font-size: 15px;
    color: #9B7B5E;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="label-top">Luiza na Cozinha</div>

    <div class="content">
      <div class="enquete-tag">Enquete</div>
      <div class="emoji-center">{{EMOJI}}</div>
      <div class="question">{{QUESTION}}</div>
      <div class="options-grid">
        <div class="option highlight">{{OPTION_1}}</div>
        <div class="option">{{OPTION_2}}</div>
        <div class="option">{{OPTION_3}}</div>
        <div class="option">{{OPTION_4}}</div>
      </div>
    </div>

    <div class="footer">
      <span class="footer-url">luizanacozinha.app</span>
      <span class="footer-cta">Comenta aqui a sua! 👇</span>
    </div>
  </div>
</body>
</html>
