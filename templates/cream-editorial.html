<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Instrument+Serif:ital@0;1&family=Caveat:wght@400;700&family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: {{HEIGHT}}px;
    background: #F7F2EA;
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Topbar */
  .topbar {
    position: absolute; top: 60px; left: 72px; right: 72px;
    display: flex; justify-content: space-between;
    font-family: 'DM Mono', monospace; font-size: 12px;
    letter-spacing: 0.2em; text-transform: uppercase; color: #9B7B5E;
    z-index: 10;
  }

  /* Bleeding number — big structural element in terracota */
  .number-big {
    position: absolute; top: 100px; left: 72px;
    font-family: 'Playfair Display', serif; font-style: italic; font-weight: 400;
    font-size: 320px; line-height: 0.78;
    color: #C8572A; letter-spacing: -0.05em;
    z-index: 2; user-select: none;
  }

  /* Rotated label next to number */
  .number-sub {
    position: absolute; top: 290px; left: 380px;
    font-family: 'DM Mono', monospace; font-size: 13px;
    letter-spacing: 0.15em; color: #1E1810;
    transform: rotate(-90deg); transform-origin: left top;
    z-index: 3;
  }

  /* Caveat annotation */
  .annotation {
    position: absolute; top: 130px; right: 90px;
    font-family: 'Caveat', cursive; font-size: 38px;
    color: #5C7A5E; transform: rotate(-4deg);
    max-width: 260px; line-height: 1.1; z-index: 7;
  }
  .annotation::before { content: "↘"; display: block; font-size: 30px; margin-bottom: 6px; }

  /* Main body */
  .body {
    position: absolute; bottom: 220px; left: 72px; right: 72px;
    z-index: 6;
  }
  .body h2 {
    font-family: 'Playfair Display', serif; font-weight: 700;
    font-size: {{HEADLINE_SIZE}}px; line-height: 0.95;
    color: #1E1810; margin: 0 0 24px 0; letter-spacing: -0.02em; max-width: 820px;
  }
  .body h2 em { font-style: italic; color: #C8572A; font-weight: 400; }
  .body p {
    font-family: 'Instrument Serif', serif; font-style: italic;
    font-size: 24px; line-height: 1.55;
    color: #3D2B1F; max-width: 660px; margin: 0;
  }

  /* Divider line */
  .underline {
    position: absolute; left: 72px; right: 72px; bottom: 200px;
    height: 1px; background: rgba(30,24,16,0.12); z-index: 5;
  }

  /* Footer */
  .footer {
    position: absolute; bottom: 60px; left: 72px; right: 72px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'DM Mono', monospace; font-size: 12px;
    letter-spacing: 0.18em; text-transform: uppercase; color: #3D2B1F;
    z-index: 10;
  }
</style>
</head>
<body>
  <div class="topbar">
    <span>Tem na Semana</span>
    <span>luizanacozinha.app</span>
  </div>

  <div class="number-big">{{NUMBER}}</div>
  <div class="number-sub">{{NUMBER_LABEL}}</div>

  <div class="annotation">{{ANNOTATION}}</div>

  <div class="body">
    <h2>{{HEADLINE}}</h2>
    <p>{{SUBTEXT}}</p>
  </div>

  <div class="underline"></div>

  <div class="footer">
    <span>{{CTA}}</span>
    <span>@luizanacozinha</span>
  </div>
</body>
</html>
