<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@400;500&family=DM+Mono:wght@400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: {{HEIGHT}}px;
    background: #F7F2EA;
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Detalhe decorativo canto superior direito */
  .deco-circle {
    position: absolute;
    top: -80px;
    right: -80px;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background: rgba(92, 122, 94, 0.08);
    pointer-events: none;
  }

  .deco-circle-2 {
    position: absolute;
    bottom: -60px;
    left: -60px;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: rgba(200, 87, 42, 0.05);
    pointer-events: none;
  }

  .container {
    position: relative;
    width: 100%;
    height: 100%;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 1;
  }

  .label-top {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.15em;
    color: #9B7B5E;
    text-transform: uppercase;
  }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 40px 0;
  }

  .tag {
    display: inline-block;
    background: #5C7A5E;
    color: #FFFDF9;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 100px;
    margin-bottom: 28px;
  }

  .headline {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: {{HEADLINE_SIZE}}px;
    line-height: 1.05;
    color: #3D2B1F;
    margin-bottom: 20px;
    max-width: 820px;
  }

  .headline em {
    font-style: italic;
    font-weight: 400;
    color: #5C7A5E;
  }

  .divider {
    width: 40px;
    height: 3px;
    background: #C8572A;
    border-radius: 2px;
    margin: 24px 0;
  }

  .body-text {
    font-family: 'DM Sans', sans-serif;
    font-size: 19px;
    line-height: 1.65;
    color: #3D2B1F;
    max-width: 760px;
  }

  .list-item {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 18px;
  }

  .list-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #C8572A;
    margin-top: 8px;
    flex-shrink: 0;
  }

  .list-text {
    font-family: 'DM Sans', sans-serif;
    font-size: 18px;
    line-height: 1.5;
    color: #3D2B1F;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .footer-url {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: #9B7B5E;
  }

  .footer-nav {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: #9B7B5E;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>
  <div class="deco-circle"></div>
  <div class="deco-circle-2"></div>

  <div class="container">
    <div class="label-top">Luiza na Cozinha</div>

    <div class="content">
      {{CONTENT_BLOCK}}
    </div>

    <div class="footer">
      <span class="footer-url">luizanacozinha.app</span>
      <span class="footer-nav">{{FOOTER_RIGHT}}</span>
    </div>
  </div>
</body>
</html>
