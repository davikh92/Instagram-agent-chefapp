<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@400;500&family=DM+Mono:wght@400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: {{HEIGHT}}px;
    background: #EDE4D3;
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
    position: relative;
  }

  .container {
    position: relative;
    width: 100%;
    height: 100%;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .label-top {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.15em;
    color: #9B7B5E;
    text-transform: uppercase;
  }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 32px 0;
  }

  /* Capa do carrossel */
  .cover-title {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: {{HEADLINE_SIZE}}px;
    line-height: 1.0;
    color: #FFFDF9;
    background: #C8572A;
    display: inline-block;
    padding: 12px 28px;
    border-radius: 4px;
    margin-bottom: 24px;
  }

  .cover-sub {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 24px;
    color: #3D2B1F;
  }

  /* Slides de steps */
  .step-row {
    display: flex;
    align-items: flex-start;
    gap: 32px;
    margin-bottom: 40px;
  }

  .step-circle {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: #C8572A;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .step-number {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 28px;
    color: #FFFDF9;
  }

  .step-content {}

  .step-title {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 36px;
    line-height: 1.1;
    color: #3D2B1F;
    margin-bottom: 10px;
  }

  .step-desc {
    font-family: 'DM Sans', sans-serif;
    font-size: 18px;
    line-height: 1.55;
    color: #3D2B1F;
    opacity: 0.75;
    max-width: 700px;
  }

  .step-time {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    color: #C8572A;
    margin-top: 8px;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .footer-url {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: #9B7B5E;
  }

  .footer-nav {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: #9B7B5E;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="label-top">Luiza na Cozinha</div>

    <div class="content">
      {{CONTENT_BLOCK}}
    </div>

    <div class="footer">
      <span class="footer-url">luizanacozinha.app</span>
      <span class="footer-nav">{{FOOTER_RIGHT}}</span>
    </div>
  </div>
</body>
</html>
