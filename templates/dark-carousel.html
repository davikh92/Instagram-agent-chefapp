<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@400;500&family=DM+Mono:wght@400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: {{HEIGHT}}px;
    background: #1E1810;
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
    position: relative;
  }

  .bg-number {
    position: absolute;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 420px;
    color: rgba(255,255,255,0.04);
    line-height: 1;
    right: -20px;
    bottom: -40px;
    pointer-events: none;
    user-select: none;
  }

  .container {
    position: relative;
    width: 100%;
    height: 100%;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 1;
  }

  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .label {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.15em;
    color: #E8784F;
    text-transform: uppercase;
  }

  .time-label {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.3);
  }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 40px 0;
  }

  .emoji-big {
    font-size: 80px;
    line-height: 1;
    margin-bottom: 24px;
  }

  .headline {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: {{HEADLINE_SIZE}}px;
    line-height: 1.0;
    color: #FFFDF9;
    margin-bottom: 16px;
    max-width: 820px;
  }

  .subheadline {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 22px;
    color: #E8784F;
    margin-bottom: 20px;
  }

  .body-text {
    font-family: 'DM Sans', sans-serif;
    font-size: 18px;
    line-height: 1.6;
    color: rgba(255,255,255,0.65);
    max-width: 760px;
  }

  .progress-bar {
    height: 2px;
    background: rgba(255,255,255,0.08);
    border-radius: 1px;
    overflow: hidden;
    margin-bottom: 24px;
  }

  .progress-fill {
    height: 100%;
    background: #E8784F;
    border-radius: 1px;
    width: {{PROGRESS}}%;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .footer-url {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.3);
  }

  .footer-nav {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>
  <div class="bg-number">{{BG_NUMBER}}</div>

  <div class="container">
    <div class="top-row">
      <span class="label">{{SLIDE_LABEL}}</span>
      <span class="time-label">{{TIME_LABEL}}</span>
    </div>

    <div class="content">
      <div class="emoji-big">{{EMOJI}}</div>
      <div class="headline">{{HEADLINE}}</div>
      <div class="subheadline">{{SUBHEADLINE}}</div>
      <div class="body-text">{{BODY}}</div>
    </div>

    <div>
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
      <div class="footer">
        <span class="footer-url">luizanacozinha.app</span>
        <span class="footer-nav">{{SLIDE_NUM}} / {{TOTAL_SLIDES}} →</span>
      </div>
    </div>
  </div>
</body>
</html>
