<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@400;500&family=DM+Mono:wght@400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: {{HEIGHT}}px;
    background: #5C7A5E;
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Aspas decorativas grandes */
  .deco-quote {
    position: absolute;
    font-family: 'Playfair Display', serif;
    font-size: 400px;
    line-height: 1;
    color: rgba(255,255,255,0.05);
    top: -60px;
    left: 40px;
    pointer-events: none;
    user-select: none;
  }

  .container {
    position: relative;
    width: 100%;
    height: 100%;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 1;
  }

  .label-top {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
  }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 40px 0;
  }

  .quote-mark {
    font-family: 'Playfair Display', serif;
    font-size: 80px;
    line-height: 0.5;
    color: rgba(255,255,255,0.4);
    margin-bottom: 32px;
    display: block;
  }

  .quote-text {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: {{HEADLINE_SIZE}}px;
    line-height: 1.25;
    color: #FFFDF9;
    margin-bottom: 40px;
    max-width: 860px;
  }

  .attribution {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .attr-line {
    width: 40px;
    height: 2px;
    background: rgba(255,255,255,0.4);
  }

  .attr-name {
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 500;
    color: rgba(255,255,255,0.85);
  }

  .attr-role {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.5);
    margin-top: 4px;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .footer-url {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.35);
  }

  .footer-cta {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: rgba(255,255,255,0.7);
  }
</style>
</head>
<body>
  <div class="deco-quote">"</div>

  <div class="container">
    <div class="label-top">Luiza na Cozinha</div>

    <div class="content">
      <span class="quote-mark">"</span>
      <div class="quote-text">{{QUOTE}}</div>
      <div class="attribution">
        <div class="attr-line"></div>
        <div>
          <div class="attr-name">{{ATTR_NAME}}</div>
          <div class="attr-role">{{ATTR_ROLE}}</div>
        </div>
      </div>
    </div>

    <div class="footer">
      <span class="footer-url">luizanacozinha.app</span>
      <span class="footer-cta">{{FOOTER_CTA}}</span>
    </div>
  </div>
</body>
</html>
