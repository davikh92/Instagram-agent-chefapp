<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Caveat:wght@400;700&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: {{HEIGHT}}px;
    background: #EDE4D3;
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Topbar */
  .topbar {
    position: absolute; top: 56px; left: 72px; right: 72px;
    display: flex; justify-content: space-between;
    font-family: 'DM Mono', monospace; font-size: 12px;
    letter-spacing: 0.2em; text-transform: uppercase; color: #9B7B5E;
    z-index: 10;
  }

  /* Kicker */
  .kicker {
    position: absolute; top: 130px; left: 72px;
    font-family: 'DM Mono', monospace; font-size: 14px;
    letter-spacing: 0.25em; text-transform: uppercase; color: #C8572A;
    z-index: 6;
  }
  .kicker::before { content: "◐"; margin-right: 12px; }

  /* Question — large Playfair */
  .question {
    position: absolute; top: 200px; left: 72px; right: 72px;
    font-family: 'Playfair Display', serif; font-weight: 700;
    font-size: {{HEADLINE_SIZE}}px; line-height: 0.96;
    color: #1E1810; letter-spacing: -0.02em; max-width: 900px;
    z-index: 6;
  }
  .question em { font-style: italic; font-weight: 400; color: #C8572A; }

  /* Caveat annotation */
  .annotation {
    position: absolute; bottom: 530px; right: 100px;
    font-family: 'Caveat', cursive; font-size: 36px;
    color: #C8572A; transform: rotate(-6deg);
    z-index: 7;
  }
  .annotation::after { content: " ↓"; }

  /* Options — stacked pills */
  .options {
    position: absolute; bottom: 220px; left: 72px; right: 72px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    z-index: 6;
  }
  .opt {
    padding: 24px 28px; border-radius: 14px;
    display: flex; align-items: center; gap: 16px;
    border: 1.5px solid rgba(30,24,16,0.12);
    background: #FFFDF9; position: relative;
    transition: transform 0.1s;
  }
  .opt .num {
    font-family: 'DM Mono', monospace; font-size: 12px;
    color: #9B7B5E; letter-spacing: 0.15em; flex-shrink: 0;
  }
  .opt .text {
    font-family: 'Playfair Display', serif; font-size: 26px;
    font-weight: 400; color: #1E1810; line-height: 1.1;
  }
  /* Hot option — terracota highlight */
  .opt.hot {
    background: #C8572A; border-color: #9E3D18;
    color: #FFFDF9; transform: rotate(-1deg);
    box-shadow: 0 12px 30px rgba(200,87,42,0.25);
  }
  .opt.hot .num { color: rgba(255,253,249,0.6); }
  .opt.hot .text { color: #FFFDF9; font-style: italic; }
  /* Gold "MAIS COMUM" badge on hot option */
  .opt.hot .hot-badge {
    position: absolute; top: -12px; right: -12px;
    background: #C49A3C; color: #1E1810;
    font-family: 'DM Mono', monospace; font-size: 10px;
    letter-spacing: 0.15em; text-transform: uppercase;
    padding: 6px 12px; border-radius: 999px; transform: rotate(8deg);
  }

  /* Footer */
  .footer {
    position: absolute; bottom: 56px; left: 72px; right: 72px;
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 20px; border-top: 1px solid rgba(30,24,16,0.15);
    font-family: 'DM Mono', monospace; font-size: 12px;
    letter-spacing: 0.2em; text-transform: uppercase; color: #3D2B1F;
    z-index: 10;
  }
</style>
</head>
<body>
  <div class="topbar">
    <span>Tem na Semana</span>
    <span>luizanacozinha.app</span>
  </div>

  <div class="kicker">{{KICKER}}</div>

  <div class="question">{{QUESTION}}</div>

  <div class="annotation">{{ANNOTATION}}</div>

  <div class="options">
    <div class="opt hot">
      <div class="hot-badge">Mais comum</div>
      <div class="num">01</div>
      <div class="text">{{OPTION_1}}</div>
    </div>
    <div class="opt">
      <div class="num">02</div>
      <div class="text">{{OPTION_2}}</div>
    </div>
    <div class="opt">
      <div class="num">03</div>
      <div class="text">{{OPTION_3}}</div>
    </div>
    <div class="opt">
      <div class="num">04</div>
      <div class="text">{{OPTION_4}}</div>
    </div>
  </div>

  <div class="footer">
    <span>{{CTA}}</span>
    <span>Pilar D — Comunidade</span>
  </div>
</body>
</html>
