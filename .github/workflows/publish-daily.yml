name: 📱 Publicar no Instagram

on:
  schedule:
    # Horários em UTC (BRT = UTC-3) — grade do Ciclo 01 (set-nov/2026)
    - cron: '0 21 * * 0'   # Dom 18h BRT — Novela das 18h
    - cron: '0 21 * * 1'   # Seg 18h BRT — catchup (último post da grade antiga: 31/08)
    - cron: '0 21 * * 2'   # Ter 18h BRT — Cardápio da Semana DM
    - cron: '0 21 * * 3'   # Qua 18h BRT — Receita LEGENDA
    - cron: '0 22 * * 4'   # Qui 19h BRT — Receita DM (grade experimental de outubro)
    - cron: '0 15 * * 5'   # Sex 12h BRT — Receita DM (set/nov)
    - cron: '0 14 * * 6'   # Sáb 11h BRT — Participação
  workflow_dispatch:        # permite publicação manual emergencial

# Garante que nunca dois jobs publicam ao mesmo tempo
concurrency:
  group: publish-instagram
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm install

      - name: Criar .env
        run: |
          echo "INSTAGRAM_ACCESS_TOKEN=${{ secrets.INSTAGRAM_ACCESS_TOKEN }}" >> .env
          echo "INSTAGRAM_USER_ID=${{ secrets.INSTAGRAM_USER_ID }}"           >> .env
          echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}"   >> .env
          echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}"         >> .env
          echo "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}"   >> .env

      - name: Publicar post do dia (--catchup publica até 2 posts pendentes)
        run: node scripts/publish.js --catchup

      - name: Atualizar dashboard
        run: node scripts/build-dashboard.js

      - name: Commit do published.json
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git stash -u
          git pull --rebase origin main
          git stash pop
          git add ready-to-post/ dashboard.html
          git diff --staged --quiet \
            || git commit -m "chore: published.json + dashboard atualizado [skip ci]"
          git push

      # Roda DEPOIS do commit de propósito: falhar antes deixaria o
      # published.json sem salvar, e os posts já publicados sairiam de novo
      # amanhã. Sem este step o job fica VERDE publicando zero posts — foi o
      # que escondeu o token invalidado do Instagram por 4 dias em jul/2026.
      - name: Acusar falha de publicação
        if: always()
        run: |
          if [ -f .publish-failed ]; then
            echo "::error::$(cat .publish-failed) publicação(ões) falharam — ver log do step de publicação"
            exit 1
          fi
          echo "Nenhuma falha de publicação."
