name: 🖼️ Gerar Imagens Domingo

on:
  schedule:
    - cron: '30 12 1 * *'   # dia  1 às 09:30 BRT (12:30 UTC)
    - cron: '30 12 15 * *'  # dia 15 às 09:30 BRT (12:30 UTC)
  workflow_dispatch:

concurrency:
  group: generate-image
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm install

      - name: Criar .env
        run: |
          echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}"                  >> .env
          echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}"    >> .env
          echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}"          >> .env
          echo "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}"    >> .env

      - name: Gerar imagens de domingo (Imagen 4)
        run: node scripts/generate-image.js --all

      - name: Commit dos metadados gerados
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git pull --rebase origin main
          git add ready-to-post/
          git diff --staged --quiet \
            || git commit -m "chore: imagens Imagen geradas automaticamente [skip ci]"
          git push
