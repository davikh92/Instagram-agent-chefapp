name: 🔁 Retry Geração Imagen

on:
# PAUSADO em 01/09/2026 - Retry da geracao de imagens - sem fila, nao ha o que refazer.
# Religar = descomentar o bloco schedule abaixo. Rodavel a mao por workflow_dispatch.
#  schedule:
#    - cron: '30 12 2 * *'   # dia  2 às 09:30 BRT
#    - cron: '30 12 16 * *'  # dia 16 às 09:30 BRT
  workflow_dispatch:

concurrency:
  group: generate-image
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm install

      - name: Criar .env
        run: |
          echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}"                  >> .env
          echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}"    >> .env
          echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}"          >> .env
          echo "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}"    >> .env

      - name: Retry geração Imagen (imagens ainda pendentes)
        run: node scripts/generate-image.js --all

      - name: Commit dos metadados gerados
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git stash -u
          git pull --rebase origin main
          git stash pop || true   # sem stash (nada mudou) nao e erro
          git add ready-to-post/
          git diff --staged --quiet \
            || git commit -m "chore: retry imagens Imagen [skip ci]"
          git push
